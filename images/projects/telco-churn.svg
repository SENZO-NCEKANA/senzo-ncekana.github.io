<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0e14"/>
      <stop offset="100%" style="stop-color:#121722"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#bg3)"/>
  <!-- Retained bar (green) -->
  <rect x="80" y="120" width="120" height="40" rx="4" fill="#22c55e" opacity="0.5"/>
  <rect x="80" y="120" width="100" height="40" rx="4" fill="#22c55e" opacity="0.7"/>
  <!-- Churning bar (red/orange) -->
  <rect x="200" y="120" width="120" height="40" rx="4" fill="#ef4444" opacity="0.4"/>
  <rect x="200" y="120" width="40" height="40" rx="4" fill="#ef4444" opacity="0.6"/>
  <!-- Trend line -->
  <path d="M60 80 L120 100 L180 85 L240 95 L300 75 L360 90" fill="none" stroke="#2ea8ff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Signal/customer icons -->
  <circle cx="100" cy="50" r="15" fill="none" stroke="#2ea8ff" stroke-width="1" opacity="0.4"/>
  <circle cx="100" cy="50" r="8" fill="#2ea8ff" opacity="0.2"/>
  <circle cx="300" cy="50" r="15" fill="none" stroke="#6b4cff" stroke-width="1" opacity="0.4"/>
  <circle cx="300" cy="50" r="8" fill="#6b4cff" opacity="0.2"/>
</svg>