<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <linearGradient id="bgSentiment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0e14"/>
      <stop offset="100%" style="stop-color:#1a1f2e"/>
    </linearGradient>
    <linearGradient id="purpleSentiment" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#6b4cff"/>
      <stop offset="100%" style="stop-color:#2ea8ff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#bgSentiment)"/>
  <!-- Review text lines -->
  <rect x="50" y="50" width="140" height="8" rx="1" fill="#6b4cff" opacity="0.4"/>
  <rect x="50" y="65" width="120" height="8" rx="1" fill="#2ea8ff" opacity="0.5"/>
  <rect x="50" y="80" width="160" height="8" rx="1" fill="#6b4cff" opacity="0.3"/>
  <rect x="50" y="95" width="100" height="8" rx="1" fill="#2ea8ff" opacity="0.4"/>
  <!-- Polarity bars: positive / neutral / negative -->
  <rect x="230" y="60" width="12" height="60" rx="2" fill="#22c55e" opacity="0.7"/>
  <rect x="250" y="75" width="12" height="45" rx="2" fill="#2ea8ff" opacity="0.5"/>
  <rect x="270" y="90" width="12" height="30" rx="2" fill="#ef4444" opacity="0.6"/>
  <!-- Sentiment labels -->
  <text x="230" y="140" font-size="8" fill="#6b4cff" opacity="0.6" font-family="sans-serif">+</text>
  <text x="250" y="140" font-size="8" fill="#2ea8ff" opacity="0.5" font-family="sans-serif">0</text>
  <text x="268" y="140" font-size="8" fill="#ef4444" opacity="0.5" font-family="sans-serif">−</text>
  <!-- Central processing node -->
  <circle cx="200" cy="125" r="20" fill="none" stroke="url(#purpleSentiment)" stroke-width="1.5" opacity="0.6"/>
  <circle cx="200" cy="125" r="10" fill="url(#purpleSentiment)" opacity="0.2"/>
  <!-- Connection lines -->
  <line x1="130" y1="85" x2="180" y2="115" stroke="url(#purpleSentiment)" stroke-width="0.8" opacity="0.4"/>
  <line x1="235" y1="90" x2="225" y2="115" stroke="url(#purpleSentiment)" stroke-width="0.8" opacity="0.4"/>
  <!-- Bottom text ribbons -->
  <rect x="50" y="185" width="80" height="10" rx="2" fill="#6b4cff" opacity="0.25"/>
  <rect x="270" y="180" width="80" height="10" rx="2" fill="#2ea8ff" opacity="0.25"/>
</svg>
