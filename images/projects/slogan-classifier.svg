<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0e14"/>
      <stop offset="100%" style="stop-color:#1a1f2e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#6b4cff"/>
      <stop offset="100%" style="stop-color:#2ea8ff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#bg1)"/>
  <!-- Neural nodes -->
  <circle cx="80" cy="80" r="8" fill="none" stroke="url(#purple)" stroke-width="1.5" opacity="0.8"/>
  <circle cx="320" cy="80" r="8" fill="none" stroke="url(#purple)" stroke-width="1.5" opacity="0.8"/>
  <circle cx="200" cy="145" r="12" fill="url(#purple)" opacity="0.4"/>
  <line x1="80" y1="80" x2="200" y2="145" stroke="url(#purple)" stroke-width="0.8" opacity="0.5"/>
  <line x1="320" y1="80" x2="200" y2="145" stroke="url(#purple)" stroke-width="0.8" opacity="0.5"/>
  <!-- Text ribbons -->
  <rect x="50" y="180" width="100" height="12" rx="2" fill="#6b4cff" opacity="0.3"/>
  <rect x="250" y="175" width="100" height="12" rx="2" fill="#2ea8ff" opacity="0.3"/>
  <rect x="160" y="200" width="80" height="8" rx="2" fill="#6b4cff" opacity="0.2"/>
  <ellipse cx="200" cy="50" rx="60" ry="20" fill="none" stroke="url(#purple)" stroke-width="0.5" opacity="0.3"/>
  <ellipse cx="200" cy="50" rx="40" ry="12" fill="none" stroke="url(#purple)" stroke-width="0.5" opacity="0.2"/>
</svg>