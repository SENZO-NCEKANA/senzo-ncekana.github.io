<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <linearGradient id="bg-pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0e14"/>
      <stop offset="100%" style="stop-color:#101522"/>
    </linearGradient>
    <linearGradient id="acc-pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b4cff"/>
      <stop offset="100%" style="stop-color:#2ea8ff"/>
    </linearGradient>
    <linearGradient id="shield-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b4cff;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#2ea8ff;stop-opacity:0.08"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="225" fill="url(#bg-pg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="75" x2="400" y2="75" stroke="#1f2533" stroke-width="0.5"/>
  <line x1="0" y1="150" x2="400" y2="150" stroke="#1f2533" stroke-width="0.5"/>
  <line x1="100" y1="0" x2="100" y2="225" stroke="#1f2533" stroke-width="0.5"/>
  <line x1="200" y1="0" x2="200" y2="225" stroke="#1f2533" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="225" stroke="#1f2533" stroke-width="0.5"/>

  <!-- Shield body -->
  <path d="M200 22 L255 48 L255 110 Q255 155 200 178 Q145 155 145 110 L145 48 Z"
        fill="url(#shield-fill)" stroke="url(#acc-pg)" stroke-width="1.8" opacity="0.9"/>

  <!-- Medical cross inside shield -->
  <rect x="188" y="68" width="24" height="68" rx="4" fill="url(#acc-pg)" opacity="0.85"/>
  <rect x="166" y="90" width="68" height="24" rx="4" fill="url(#acc-pg)" opacity="0.85"/>

  <!-- Agent nodes — left cluster (OCR agent) -->
  <circle cx="82" cy="80" r="7" fill="none" stroke="#6b4cff" stroke-width="1.5" opacity="0.7"/>
  <circle cx="58" cy="112" r="5" fill="none" stroke="#6b4cff" stroke-width="1.2" opacity="0.5"/>
  <circle cx="96" cy="130" r="5" fill="none" stroke="#6b4cff" stroke-width="1.2" opacity="0.5"/>
  <line x1="82" y1="80" x2="58" y2="112" stroke="#6b4cff" stroke-width="0.8" opacity="0.4"/>
  <line x1="82" y1="80" x2="96" y2="130" stroke="#6b4cff" stroke-width="0.8" opacity="0.4"/>
  <line x1="82" y1="80" x2="145" y2="100" stroke="#6b4cff" stroke-width="0.8" opacity="0.35" stroke-dasharray="4 3"/>

  <!-- Agent nodes — right cluster (Reporting agent) -->
  <circle cx="318" cy="80" r="7" fill="none" stroke="#2ea8ff" stroke-width="1.5" opacity="0.7"/>
  <circle cx="342" cy="112" r="5" fill="none" stroke="#2ea8ff" stroke-width="1.2" opacity="0.5"/>
  <circle cx="304" cy="130" r="5" fill="none" stroke="#2ea8ff" stroke-width="1.2" opacity="0.5"/>
  <line x1="318" y1="80" x2="342" y2="112" stroke="#2ea8ff" stroke-width="0.8" opacity="0.4"/>
  <line x1="318" y1="80" x2="304" y2="130" stroke="#2ea8ff" stroke-width="0.8" opacity="0.4"/>
  <line x1="318" y1="80" x2="255" y2="100" stroke="#2ea8ff" stroke-width="0.8" opacity="0.35" stroke-dasharray="4 3"/>

  <!-- Label bar at bottom -->
  <rect x="0" y="195" width="400" height="30" fill="#0d1018" opacity="0.7"/>
  <text x="200" y="215" text-anchor="middle" font-family="system-ui, Arial, sans-serif"
        font-size="11" font-weight="600" letter-spacing="2" fill="url(#acc-pg)" opacity="0.9">
    PHARMA GUARD · AI PLATFORM
  </text>
</svg>
